<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="340" viewBox="0 0 1060 340" role="img">
  <title>PTP software on a node with an on-board DPLL shared across NICs</title>
  <desc>The DPLL is not part of a single NIC but sits on the platform, external to the NICs. It is fed from the PHC of the receiving NIC and distributes timing to the PHCs of the other NICs, so all NICs in the node share the same time. ts2phc aligns the additional PHCs.</desc>

  <defs>
    <style>
      text { font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif; fill: #0c322c; }
      .diagTitle { font-size: 16px; font-weight: 600; }
      .node      { font-size: 14px; font-weight: 600; }
      .role      { font-size: 11px; fill: #4a5a55; }
      .onDark    { fill: #ffffff; }
      .onDarkSub { fill: #c9e8d8; font-size: 11px; }
      .badge     { font-size: 13px; font-weight: 600; }
      .host   { fill: #f7faf9; stroke: #cfe3da; stroke-width: 1.5; }
      .nic    { fill: #ffffff; stroke: #9bb3ab; stroke-width: 1.5; }
      .sys    { fill: #ffffff; stroke: #9bb3ab; stroke-width: 1.5; }
      .pill   { fill: #e6f7ef; stroke: #30ba78; stroke-width: 1.5; }
      .dpll   { fill: #e6f7ef; stroke: #30ba78; stroke-width: 1.8; }
      .daemon { fill: #0c322c; stroke: #0c322c; }
      .flow   { stroke: #0c322c; stroke-width: 2; fill: none; marker-end: url(#arr); }
      .internal { stroke: #4a5a55; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#arr2); }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0c322c"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5a55"/>
    </marker>
  </defs>

  <text class="diagTitle" x="30" y="34">PTP software on a node — on-board DPLL shared across NICs</text>

  <!-- Host -->
  <rect class="host" x="150" y="64" width="866" height="252" rx="10"/>
  <text class="node" x="583" y="90" text-anchor="middle">Host (cluster node)</text>

  <!-- PTP from the network -->
  <line class="flow" x1="30" y1="176" x2="148" y2="176"/>
  <text class="role" x="90" y="165" text-anchor="middle">PTP (from GM/BC)</text>

  <!-- ptp4l -->
  <rect class="daemon" x="162" y="150" width="100" height="52" rx="8"/>
  <text class="node onDark" x="212" y="174" text-anchor="middle">ptp4l</text>
  <text class="onDarkSub" x="212" y="192" text-anchor="middle">PTP daemon</text>
  <text class="role" x="212" y="222" text-anchor="middle">disciplines NIC A's PHC</text>

  <line class="flow" x1="262" y1="176" x2="306" y2="176"/>

  <!-- NIC A (receiving NIC) -->
  <rect class="nic" x="310" y="126" width="150" height="100" rx="8"/>
  <text class="node" x="385" y="148" text-anchor="middle">NIC A</text>
  <rect class="pill" x="330" y="160" width="110" height="30" rx="15"/>
  <text class="badge" x="385" y="180" text-anchor="middle">PHC</text>
  <text class="role" x="385" y="214" text-anchor="middle">receives PTP</text>

  <!-- ts2phc daemon aligns NIC B's PHC from NIC A's PHC -->
  <line class="flow" x1="460" y1="176" x2="478" y2="176"/>
  <rect class="daemon" x="480" y="150" width="64" height="52" rx="8"/>
  <text class="node onDark" x="512" y="174" text-anchor="middle">ts2phc</text>
  <text class="onDarkSub" x="512" y="192" text-anchor="middle">PHC align</text>
  <line class="flow" x1="544" y1="176" x2="562" y2="176"/>

  <!-- NIC B (other NIC) -->
  <rect class="nic" x="564" y="126" width="150" height="100" rx="8"/>
  <text class="node" x="639" y="148" text-anchor="middle">NIC B</text>
  <rect class="pill" x="584" y="160" width="110" height="30" rx="15"/>
  <text class="badge" x="639" y="180" text-anchor="middle">PHC</text>
  <text class="role" x="639" y="214" text-anchor="middle">regenerates PTP</text>

  <line class="flow" x1="714" y1="176" x2="758" y2="176"/>

  <!-- phc2sys -->
  <rect class="daemon" x="762" y="150" width="100" height="52" rx="8"/>
  <text class="node onDark" x="812" y="174" text-anchor="middle">phc2sys</text>
  <text class="onDarkSub" x="812" y="192" text-anchor="middle">clock sync</text>
  <text class="role" x="812" y="222" text-anchor="middle">aligns the system clock</text>

  <line class="flow" x1="862" y1="176" x2="880" y2="176"/>

  <!-- System clock -->
  <rect class="sys" x="882" y="150" width="110" height="52" rx="8"/>
  <text class="node" x="937" y="180" text-anchor="middle">System clock</text>

  <!-- on-board DPLL bar (external to the NICs) -->
  <rect class="dpll" x="310" y="254" width="404" height="34" rx="17"/>
  <text class="badge" x="512" y="276" text-anchor="middle">on-board DPLL (external to the NICs)</text>
  <text class="role" x="512" y="308" text-anchor="middle">keeps the NIC PHCs aligned from a common reference</text>

  <!-- NIC A PHC feeds the DPLL (down); DPLL feeds NIC B PHC (up) -->
  <line class="internal" x1="385" y1="228" x2="385" y2="254"/>
  <text class="role" x="375" y="246" text-anchor="end">feed</text>
  <line class="internal" x1="639" y1="254" x2="639" y2="228"/>
  <text class="role" x="649" y="246" text-anchor="start">distribute</text>
</svg>
