<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300" role="img">
  <title>PTP software on a node with an integrated DPLL in the NIC</title>
  <desc>The NIC integrates a manageable DPLL configured through the Linux DPLL subsystem. ptp4l disciplines the PHC and phc2sys aligns the system clock.</desc>

  <defs>
    <style>
      text { font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif; fill: #0c322c; }
      .diagTitle { font-size: 16px; font-weight: 600; }
      .node      { font-size: 14px; font-weight: 600; }
      .role      { font-size: 11px; fill: #4a5a55; }
      .onDark    { fill: #ffffff; }
      .onDarkSub { fill: #c9e8d8; font-size: 11px; }
      .badge     { font-size: 13px; font-weight: 600; }
      .host   { fill: #f7faf9; stroke: #cfe3da; stroke-width: 1.5; }
      .nic    { fill: #ffffff; stroke: #9bb3ab; stroke-width: 1.5; }
      .sys    { fill: #ffffff; stroke: #9bb3ab; stroke-width: 1.5; }
      .pill   { fill: #e6f7ef; stroke: #30ba78; stroke-width: 1.5; }
      .daemon { fill: #0c322c; stroke: #0c322c; }
      .flow   { stroke: #0c322c; stroke-width: 2; fill: none; marker-end: url(#arr); }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0c322c"/>
    </marker>
  </defs>

  <text class="diagTitle" x="30" y="34">PTP software on a node — NIC with an integrated DPLL</text>

  <!-- Host -->
  <rect class="host" x="150" y="70" width="800" height="200" rx="10"/>
  <text class="node" x="550" y="98" text-anchor="middle">Host (cluster node)</text>

  <!-- PTP from the network -->
  <line class="flow" x1="30" y1="178" x2="188" y2="178"/>
  <text class="role" x="106" y="167" text-anchor="middle">PTP (from GM/BC)</text>

  <!-- ptp4l -->
  <rect class="daemon" x="190" y="150" width="130" height="56" rx="8"/>
  <text class="node onDark" x="255" y="175" text-anchor="middle">ptp4l</text>
  <text class="onDarkSub" x="255" y="193" text-anchor="middle">PTP daemon</text>
  <text class="role" x="255" y="228" text-anchor="middle">disciplines the PHC</text>

  <line class="flow" x1="320" y1="178" x2="378" y2="178"/>

  <!-- NIC with PHC + DPLL -->
  <rect class="nic" x="380" y="132" width="200" height="112" rx="8"/>
  <text class="node" x="398" y="150" text-anchor="start">NIC</text>
  <rect class="pill" x="410" y="160" width="140" height="36" rx="18"/>
  <text class="badge" x="480" y="184" text-anchor="middle">PHC</text>
  <rect class="pill" x="410" y="202" width="140" height="34" rx="17"/>
  <text class="badge" x="480" y="224" text-anchor="middle">DPLL</text>
  <text class="role" x="480" y="262" text-anchor="middle">managed via the Linux DPLL subsystem</text>

  <line class="flow" x1="582" y1="178" x2="638" y2="178"/>

  <!-- phc2sys -->
  <rect class="daemon" x="640" y="150" width="130" height="56" rx="8"/>
  <text class="node onDark" x="705" y="175" text-anchor="middle">phc2sys</text>
  <text class="onDarkSub" x="705" y="193" text-anchor="middle">clock sync</text>
  <text class="role" x="705" y="228" text-anchor="middle">aligns the system clock</text>

  <line class="flow" x1="770" y1="178" x2="828" y2="178"/>

  <!-- System clock -->
  <rect class="sys" x="830" y="150" width="110" height="56" rx="8"/>
  <text class="node" x="885" y="183" text-anchor="middle">System clock</text>
</svg>
