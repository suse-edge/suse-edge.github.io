<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img">
  <title>Boundary Clock scenario — PTP only, single NIC, with propagation to an Ordinary Clock</title>
  <desc>A Grand Master feeds a PTP-aware switch. A Boundary Clock server on a single multi-port NIC receives PTP on em2 and regenerates it on em3 towards a downstream Ordinary Clock server.</desc>

  <defs>
    <style>
      text { font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif; fill: #0c322c; }
      .diagTitle { font-size: 16px; font-weight: 600; }
      .section   { font-size: 12px; font-weight: 600; fill: #4a5a55; }
      .node      { font-size: 14px; font-weight: 600; }
      .role      { font-size: 11px; fill: #4a5a55; }
      .onDark    { fill: #ffffff; }
      .onDarkSub { fill: #c9e8d8; font-size: 11px; }
      .badge     { font-size: 13px; font-weight: 600; }
      .legend    { font-size: 12px; }
      .box    { fill: #ffffff; stroke: #30ba78; stroke-width: 2; }
      .ref    { fill: #efefef; stroke: #0c322c; stroke-width: 1.5; }
      .gm     { fill: #0c322c; stroke: #0c322c; }
      .sw     { fill: #ffffff; stroke: #9bb3ab; stroke-width: 1.5; }
      .pill   { fill: #e6f7ef; stroke: #30ba78; stroke-width: 1.5; }
      .portRx { fill: #0c322c; }
      .portTx { fill: #30ba78; }
      .ptp    { stroke: #0c322c; stroke-width: 2; fill: none; marker-end: url(#arr); }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0c322c"/>
    </marker>
  </defs>

  <text class="diagTitle" x="30" y="30">Boundary Clock (PTP-only) — single NIC, propagation to an Ordinary Clock</text>
  <text class="section" x="30" y="58">ITU-T G.8275.1 (Layer 2)</text>

  <!-- PTP-aware switch (top bar) -->
  <rect class="sw" x="170" y="80" width="700" height="56" rx="8"/>
  <text class="node" x="520" y="104" text-anchor="middle">PTP-aware switch (T-BC)</text>
  <text class="role" x="520" y="122" text-anchor="middle">ptp enable on the timing ports</text>

  <!-- GNSS / PRTC -->
  <rect class="ref" x="30" y="360" width="96" height="46" rx="6"/>
  <text class="role" x="78" y="387" text-anchor="middle">GNSS / PRTC</text>
  <line class="ptp" x1="126" y1="383" x2="148" y2="383"/>

  <!-- Grand Master -->
  <rect class="gm" x="150" y="330" width="170" height="120" rx="8"/>
  <text class="node onDark" x="235" y="386" text-anchor="middle">GM clock</text>
  <text class="onDarkSub" x="235" y="408" text-anchor="middle">Time Transmitter</text>

  <!-- GM -> switch -->
  <line class="ptp" x1="235" y1="330" x2="235" y2="138"/>
  <text class="role" x="222" y="234" text-anchor="middle" transform="rotate(-90 222 234)">PTP</text>

  <!-- Boundary Clock server -->
  <rect class="box" x="410" y="320" width="230" height="140" rx="8"/>
  <text class="node" x="525" y="346" text-anchor="middle">BC server</text>
  <text class="role" x="525" y="363" text-anchor="middle">Boundary Clock</text>
  <circle class="portRx" cx="455" cy="320" r="6"/>
  <circle class="portTx" cx="605" cy="320" r="6"/>
  <rect class="pill" x="470" y="374" width="110" height="28" rx="14"/>
  <text class="badge" x="525" y="394" text-anchor="middle">PHC</text>
  <text class="role" x="525" y="425" text-anchor="middle">receive: em2</text>
  <text class="role" x="525" y="442" text-anchor="middle">forward: em3</text>

  <!-- switch -> BC em2 (receive) -->
  <line class="ptp" x1="455" y1="138" x2="455" y2="314"/>
  <text class="role" x="442" y="230" text-anchor="middle" transform="rotate(-90 442 230)">receive · em2</text>

  <!-- BC em3 -> switch (forward) -->
  <line class="ptp" x1="605" y1="320" x2="605" y2="138"/>
  <text class="role" x="592" y="230" text-anchor="middle" transform="rotate(-90 592 230)">forward · em3</text>

  <!-- Ordinary Clock server -->
  <rect class="box" x="742" y="330" width="180" height="120" rx="8"/>
  <text class="node" x="832" y="360" text-anchor="middle">OC server</text>
  <text class="role" x="832" y="379" text-anchor="middle">Ordinary Clock — Time Receiver</text>
  <circle class="portRx" cx="832" cy="330" r="6"/>
  <rect class="pill" x="787" y="392" width="90" height="26" rx="13"/>
  <text class="badge" x="832" y="410" text-anchor="middle">PHC</text>
  <text class="role" x="832" y="436" text-anchor="middle">ens6f0np0</text>

  <!-- switch -> OC (receive) -->
  <line class="ptp" x1="832" y1="138" x2="832" y2="324"/>
  <text class="role" x="819" y="234" text-anchor="middle" transform="rotate(-90 819 234)">PTP</text>

  <!-- Legend -->
  <circle class="portRx" cx="180" cy="474" r="6"/>
  <text class="legend" x="192" y="478" text-anchor="start">Time Receiver port</text>
  <circle class="portTx" cx="360" cy="474" r="6"/>
  <text class="legend" x="372" y="478" text-anchor="start">Time Transmitter port</text>
</svg>
