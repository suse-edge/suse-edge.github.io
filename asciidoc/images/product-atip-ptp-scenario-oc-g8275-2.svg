<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="440" viewBox="0 0 980 440" role="img">
  <title>Ordinary Clock scenario — PTP only (ITU-T G.8275.2)</title>
  <desc>A master distributes time over G.8275.2 (Layer 3 unicast) across an IP network that is not PTP-aware to an Ordinary Clock node. Inside the node, ptp4l disciplines the NIC PHC and phc2sys aligns the system clock.</desc>

  <defs>
    <style>
      text { font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif; fill: #0c322c; }
      .diagTitle { font-size: 16px; font-weight: 600; }
      .section   { font-size: 12px; font-weight: 600; fill: #4a5a55; }
      .node      { font-size: 14px; font-weight: 600; }
      .role      { font-size: 11px; fill: #4a5a55; }
      .onDark    { fill: #ffffff; }
      .onDarkSub { fill: #c9e8d8; font-size: 11px; }
      .badge     { font-size: 13px; font-weight: 600; }
      .box    { fill: #ffffff; stroke: #30ba78; stroke-width: 2; }
      .ref    { fill: #efefef; stroke: #0c322c; stroke-width: 1.5; }
      .gm     { fill: #0c322c; stroke: #0c322c; }
      .net    { fill: #ffffff; stroke: #9bb3ab; stroke-width: 1.5; stroke-dasharray: 5 3; }
      .host   { fill: #f7faf9; stroke: #cfe3da; stroke-width: 1.5; }
      .nic    { fill: #ffffff; stroke: #9bb3ab; stroke-width: 1.5; }
      .sys    { fill: #ffffff; stroke: #9bb3ab; stroke-width: 1.5; }
      .pill   { fill: #e6f7ef; stroke: #30ba78; stroke-width: 1.5; }
      .daemon { fill: #0c322c; stroke: #0c322c; }
      .ptp    { stroke: #0c322c; stroke-width: 2; fill: none; marker-end: url(#arr); }
      .flow   { stroke: #0c322c; stroke-width: 2; fill: none; marker-end: url(#arr); }
      .zoom   { stroke: #9bb3ab; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0c322c"/>
    </marker>
  </defs>

  <text class="diagTitle" x="30" y="30">Ordinary Clock (OC) — PTP only (ITU-T G.8275.2)</text>

  <!-- ===== Topology ===== -->
  <text class="section" x="30" y="60">Topology</text>

  <!-- GNSS / PRTC -->
  <rect class="ref" x="20" y="92" width="96" height="46" rx="6"/>
  <text class="role" x="68" y="119" text-anchor="middle">GNSS / PRTC</text>

  <line class="ptp" x1="116" y1="115" x2="150" y2="115"/>

  <!-- Grand Master -->
  <rect class="gm" x="152" y="85" width="156" height="60" rx="8"/>
  <text class="node onDark" x="230" y="110" text-anchor="middle">Master (GM/BC)</text>
  <text class="onDarkSub" x="230" y="128" text-anchor="middle">reached by IP</text>

  <line class="ptp" x1="308" y1="115" x2="372" y2="115"/>
  <text class="role" x="340" y="107" text-anchor="middle">unicast</text>

  <!-- IP network (not PTP-aware) -->
  <rect class="net" x="374" y="85" width="176" height="60" rx="8"/>
  <text class="node" x="462" y="110" text-anchor="middle">IP network</text>
  <text class="role" x="462" y="128" text-anchor="middle">not PTP-aware</text>

  <line class="ptp" x1="550" y1="115" x2="614" y2="115"/>
  <text class="role" x="582" y="107" text-anchor="middle">unicast</text>

  <!-- Ordinary Clock -->
  <rect class="box" x="616" y="85" width="190" height="60" rx="8"/>
  <text class="node" x="711" y="110" text-anchor="middle">Ordinary Clock (OC)</text>
  <text class="role" x="711" y="128" text-anchor="middle">Time Receiver — this node</text>

  <!-- zoom connector into the detailed view -->
  <line class="zoom" x1="711" y1="145" x2="711" y2="200"/>

  <!-- ===== Inside the OC node ===== -->
  <rect class="host" x="90" y="200" width="800" height="210" rx="10"/>
  <text class="node" x="490" y="228" text-anchor="middle">Inside the OC node</text>

  <!-- PTP in -->
  <line class="flow" x1="20" y1="320" x2="128" y2="320"/>
  <text class="role" x="74" y="310" text-anchor="middle">PTP unicast (UDP/IP)</text>

  <!-- ptp4l -->
  <rect class="daemon" x="130" y="292" width="126" height="56" rx="8"/>
  <text class="node onDark" x="193" y="317" text-anchor="middle">ptp4l</text>
  <text class="onDarkSub" x="193" y="335" text-anchor="middle">PTP daemon</text>
  <text class="role" x="193" y="372" text-anchor="middle">unicast client &#8594; SLAVE; disciplines PHC</text>

  <line class="flow" x1="256" y1="320" x2="314" y2="320"/>

  <!-- NIC -->
  <rect class="nic" x="316" y="278" width="196" height="92" rx="8"/>
  <text class="node" x="334" y="298" text-anchor="start">NIC</text>
  <rect class="pill" x="346" y="308" width="140" height="36" rx="18"/>
  <text class="badge" x="416" y="332" text-anchor="middle">PHC</text>
  <text class="role" x="414" y="388" text-anchor="middle">single PTP port</text>

  <line class="flow" x1="512" y1="320" x2="574" y2="320"/>

  <!-- phc2sys -->
  <rect class="daemon" x="576" y="292" width="126" height="56" rx="8"/>
  <text class="node onDark" x="639" y="317" text-anchor="middle">phc2sys</text>
  <text class="onDarkSub" x="639" y="335" text-anchor="middle">clock sync</text>
  <text class="role" x="639" y="372" text-anchor="middle">aligns the system clock</text>

  <line class="flow" x1="702" y1="320" x2="760" y2="320"/>

  <!-- System clock -->
  <rect class="sys" x="762" y="292" width="118" height="56" rx="8"/>
  <text class="node" x="821" y="325" text-anchor="middle">System clock</text>
</svg>
