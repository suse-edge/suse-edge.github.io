<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img">
  <title>Boundary Clock scenario — PTP only, multi-NIC GNR-D node with on-board DPLL</title>
  <desc>A Grandmaster feeds a PTP-aware switch. A GNR-D Boundary Clock server receives PTP on the integrated NIC (em2); the integrated PHC feeds the on-board DPLL, which distributes timing (together with ts2phc) to an add-in NIC that regenerates PTP on p1p1 towards a downstream Ordinary Clock server.</desc>

  <defs>
    <style>
      text { font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif; fill: #0c322c; }
      .diagTitle { font-size: 16px; font-weight: 600; }
      .section   { font-size: 12px; font-weight: 600; fill: #4a5a55; }
      .node      { font-size: 14px; font-weight: 600; }
      .subnode   { font-size: 12px; font-weight: 600; }
      .role      { font-size: 11px; fill: #4a5a55; }
      .onDark    { fill: #ffffff; }
      .onDarkSub { fill: #c9e8d8; font-size: 11px; }
      .badge     { font-size: 12px; font-weight: 600; }
      .legend    { font-size: 12px; }
      .box    { fill: #ffffff; stroke: #30ba78; stroke-width: 2; }
      .subbox { fill: #f4faf7; stroke: #9bb3ab; stroke-width: 1.2; }
      .ref    { fill: #efefef; stroke: #0c322c; stroke-width: 1.5; }
      .gm     { fill: #0c322c; stroke: #0c322c; }
      .sw     { fill: #ffffff; stroke: #9bb3ab; stroke-width: 1.5; }
      .pill   { fill: #e6f7ef; stroke: #30ba78; stroke-width: 1.5; }
      .dpll   { fill: #e6f7ef; stroke: #30ba78; stroke-width: 1.8; }
      .portRx { fill: #0c322c; }
      .portTx { fill: #30ba78; }
      .ptp      { stroke: #0c322c; stroke-width: 2; fill: none; marker-end: url(#arr); }
      .internal { stroke: #4a5a55; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#arr2); }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0c322c"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5a55"/>
    </marker>
  </defs>

  <text class="diagTitle" x="30" y="30">Boundary Clock (PTP-only) — multi-NIC GNR-D node with on-board DPLL</text>
  <text class="section" x="30" y="56">ITU-T G.8275.1 (Layer 2) · integrated NIC + add-in cards · internal timing module (DPLL)</text>

  <!-- PTP-aware switch (top bar) -->
  <rect class="sw" x="200" y="84" width="700" height="54" rx="8"/>
  <text class="node" x="550" y="108" text-anchor="middle">PTP-aware switch (T-BC)</text>
  <text class="role" x="550" y="126" text-anchor="middle">ptp enable on the timing ports</text>

  <!-- GNSS / PRTC -->
  <rect class="ref" x="24" y="398" width="82" height="44" rx="6"/>
  <text class="role" x="65" y="424" text-anchor="middle">GNSS / PRTC</text>
  <line class="ptp" x1="106" y1="420" x2="118" y2="420"/>

  <!-- Grandmaster -->
  <rect class="gm" x="120" y="360" width="160" height="120" rx="8"/>
  <text class="node onDark" x="200" y="414" text-anchor="middle">GM clock</text>
  <text class="onDarkSub" x="200" y="436" text-anchor="middle">Time Transmitter · domain 24</text>

  <!-- GM -> switch -->
  <line class="ptp" x1="200" y1="360" x2="200" y2="140"/>
  <text class="role" x="187" y="250" text-anchor="middle" transform="rotate(-90 187 250)">PTP</text>

  <!-- Boundary Clock server -->
  <rect class="box" x="360" y="290" width="380" height="230" rx="10"/>
  <text class="node" x="550" y="316" text-anchor="middle">BC server — Boundary Clock (GNR-D)</text>

  <!-- outer ports on the BC box top edge -->
  <circle class="portRx" cx="458" cy="290" r="6"/>
  <circle class="portTx" cx="643" cy="290" r="6"/>
  <line class="ptp" x1="458" y1="290" x2="458" y2="336"/>
  <line class="ptp" x1="643" y1="336" x2="643" y2="292"/>

  <!-- switch -> BC em2 (receive) -->
  <line class="ptp" x1="458" y1="138" x2="458" y2="284"/>
  <text class="role" x="449" y="211" text-anchor="middle" transform="rotate(-90 449 211)">receive · em2</text>
  <text class="role" x="435" y="211" text-anchor="middle" transform="rotate(-90 435 211)">upstream VLAN</text>

  <!-- BC p1p1 -> switch (forward) -->
  <line class="ptp" x1="643" y1="290" x2="643" y2="140"/>
  <text class="role" x="634" y="211" text-anchor="middle" transform="rotate(-90 634 211)">forward · p1p1</text>
  <text class="role" x="620" y="211" text-anchor="middle" transform="rotate(-90 620 211)">downstream VLAN</text>

  <!-- Integrated NIC -->
  <rect class="subbox" x="380" y="336" width="155" height="120" rx="6"/>
  <text class="subnode" x="457" y="358" text-anchor="middle">Integrated NIC</text>
  <text class="role" x="457" y="374" text-anchor="middle">E825-C</text>
  <rect class="pill" x="407" y="384" width="100" height="24" rx="12"/>
  <text class="badge" x="457" y="401" text-anchor="middle">/dev/ptp1</text>
  <text class="role" x="457" y="426" text-anchor="middle">receive: em2</text>
  <text class="role" x="457" y="443" text-anchor="middle">admin port: em5</text>

  <!-- Add-in NIC -->
  <rect class="subbox" x="565" y="336" width="155" height="120" rx="6"/>
  <text class="subnode" x="642" y="358" text-anchor="middle">Add-in NIC</text>
  <text class="role" x="642" y="374" text-anchor="middle">E830-CC</text>
  <rect class="pill" x="592" y="384" width="100" height="24" rx="12"/>
  <text class="badge" x="642" y="401" text-anchor="middle">/dev/ptp2</text>
  <text class="role" x="642" y="426" text-anchor="middle">forward: p1p1</text>
  <text class="role" x="642" y="443" text-anchor="middle">serverOnly</text>

  <!-- ts2phc internal sync between PHCs -->
  <line class="internal" x1="507" y1="396" x2="588" y2="396"/>
  <text class="role" x="549" y="390" text-anchor="middle">ts2phc</text>

  <!-- on-board DPLL bar -->
  <rect class="dpll" x="400" y="474" width="300" height="32" rx="16"/>
  <text class="badge" x="550" y="494" text-anchor="middle">on-board DPLL (timing module)</text>

  <!-- DPLL internal signals: integrated PHC feeds the DPLL (down), DPLL feeds the add-in PHC (up) -->
  <line class="internal" x1="457" y1="458" x2="457" y2="474"/>
  <line class="internal" x1="642" y1="474" x2="642" y2="458"/>
  <text class="role" x="550" y="466" text-anchor="middle">SDP0/SDP2 → DPLL → SDP1</text>

  <!-- Ordinary Clock server -->
  <rect class="box" x="780" y="360" width="160" height="120" rx="8"/>
  <text class="node" x="860" y="390" text-anchor="middle">OC server</text>
  <text class="role" x="860" y="408" text-anchor="middle">Ordinary Clock · Time Receiver</text>
  <circle class="portRx" cx="860" cy="360" r="6"/>
  <rect class="pill" x="815" y="420" width="90" height="26" rx="13"/>
  <text class="badge" x="860" y="438" text-anchor="middle">PHC</text>
  <text class="role" x="860" y="464" text-anchor="middle">ens6f0np0 · downstream VLAN</text>

  <!-- switch -> OC (receive) -->
  <line class="ptp" x1="860" y1="138" x2="860" y2="354"/>
  <text class="role" x="847" y="250" text-anchor="middle" transform="rotate(-90 847 250)">PTP</text>

  <!-- Legend -->
  <circle class="portRx" cx="200" cy="560" r="6"/>
  <text class="legend" x="212" y="564" text-anchor="start">Time Receiver port</text>
  <circle class="portTx" cx="400" cy="560" r="6"/>
  <text class="legend" x="412" y="564" text-anchor="start">Time Transmitter port</text>
  <line class="internal" x1="620" y1="560" x2="656" y2="560"/>
  <text class="legend" x="664" y="564" text-anchor="start">internal DPLL / ts2phc signals</text>
</svg>
