<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img">
  <title>Precision Time Protocol with SyncE, time and frequency distribution</title>
  <desc>A Grandmaster clock locked to a time and frequency reference distributes time via PTP and frequency via SyncE to a Boundary Clock, which regenerates both towards downstream Ordinary Clocks. SyncE is an optional enhancement.</desc>

  <defs>
    <style>
      text { font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif; fill: #0c322c; }
      .diagTitle { font-size: 16px; font-weight: 600; }
      .node      { font-size: 14px; font-weight: 600; }
      .role      { font-size: 11px; fill: #4a5a55; }
      .onDark    { fill: #ffffff; }
      .onDarkSub { fill: #c9e8d8; font-size: 12px; }
      .badge     { font-size: 12px; font-weight: 600; }
      .legend    { font-size: 12px; }
      .box   { fill: #ffffff; stroke: #30ba78; stroke-width: 2; }
      .ref   { fill: #efefef; stroke: #0c322c; stroke-width: 1.5; }
      .gm    { fill: #0c322c; stroke: #0c322c; }
      .pill  { fill: #e6f7ef; stroke: #30ba78; stroke-width: 1.5; }
      .portRx { fill: #0c322c; }
      .portTx { fill: #30ba78; }
      .ptp   { stroke: #0c322c; stroke-width: 2; fill: none; marker-end: url(#ptpArrow); }
      .synce { stroke: #30ba78; stroke-width: 2; fill: none; stroke-dasharray: 6 5; marker-end: url(#synceArrow); }
    </style>
    <marker id="ptpArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0c322c"/>
    </marker>
    <marker id="synceArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#30ba78"/>
    </marker>
  </defs>

  <text class="diagTitle" x="30" y="30">Precision Time Protocol with SyncE — time and frequency distribution</text>

  <!-- External reference -->
  <rect class="ref" x="40" y="60" width="170" height="50" rx="6"/>
  <text class="node" x="125" y="90" text-anchor="middle">GNSS / PRTC</text>

  <!-- Grandmaster -->
  <rect class="gm" x="40" y="180" width="170" height="140" rx="8"/>
  <text class="node onDark" x="125" y="228" text-anchor="middle">Grandmaster (GM)</text>
  <text class="onDarkSub" x="125" y="252" text-anchor="middle">Primary reference clock</text>
  <text class="onDarkSub" x="125" y="294" text-anchor="middle">Time Transmitter</text>

  <!-- Reference into the GM (time + frequency traceability) -->
  <line class="ptp" x1="125" y1="110" x2="125" y2="180"/>
  <text class="role" x="134" y="148" text-anchor="start">time + frequency</text>
  <text class="role" x="134" y="163" text-anchor="start">reference</text>

  <!-- GM to BC: PTP (time) + SyncE (frequency) -->
  <line class="ptp"   x1="210" y1="250" x2="378" y2="250"/>
  <line class="synce" x1="210" y1="276" x2="378" y2="276"/>
  <text class="role" x="294" y="242" text-anchor="middle">PTP (phase/time)</text>
  <text class="role" x="294" y="294" text-anchor="middle">SyncE (frequency)</text>

  <!-- Boundary Clock -->
  <rect class="box" x="380" y="150" width="220" height="210" rx="8"/>
  <text class="node" x="490" y="184" text-anchor="middle">Boundary Clock (BC)</text>
  <circle class="portRx" cx="380" cy="255" r="6"/>
  <circle class="portTx" cx="600" cy="205" r="6"/>
  <circle class="portTx" cx="600" cy="305" r="6"/>
  <text class="role" x="400" y="255" text-anchor="middle" transform="rotate(-90 400 255)">Time Receiver</text>
  <text class="role" x="582" y="255" text-anchor="middle" transform="rotate(-90 582 255)">Time Transmitter</text>
  <rect class="pill" x="440" y="262" width="100" height="36" rx="18"/>
  <text class="badge" x="490" y="285" text-anchor="middle">PHC</text>

  <!-- BC to OC1 -->
  <line class="ptp"   x1="600" y1="196" x2="718" y2="146"/>
  <line class="synce" x1="600" y1="210" x2="718" y2="160"/>

  <!-- BC to OC2 -->
  <line class="ptp"   x1="600" y1="300" x2="718" y2="356"/>
  <line class="synce" x1="600" y1="314" x2="718" y2="370"/>

  <!-- Ordinary Clock 1 -->
  <rect class="box" x="720" y="96" width="160" height="96" rx="8"/>
  <text class="node" x="800" y="134" text-anchor="middle">Ordinary Clock (OC)</text>
  <text class="role" x="800" y="156" text-anchor="middle">Time Receiver</text>
  <rect class="pill" x="755" y="164" width="90" height="20" rx="10"/>
  <text class="badge" x="800" y="179" text-anchor="middle">PHC</text>

  <!-- Ordinary Clock 2 -->
  <rect class="box" x="720" y="318" width="160" height="96" rx="8"/>
  <text class="node" x="800" y="356" text-anchor="middle">Ordinary Clock (OC)</text>
  <text class="role" x="800" y="378" text-anchor="middle">Time Receiver</text>
  <rect class="pill" x="755" y="386" width="90" height="20" rx="10"/>
  <text class="badge" x="800" y="401" text-anchor="middle">PHC</text>

  <!-- Legend -->
  <line class="ptp" x1="300" y1="444" x2="340" y2="444"/>
  <text class="legend" x="348" y="448" text-anchor="start">PTP — time / phase</text>
  <line class="synce" x1="480" y1="444" x2="520" y2="444"/>
  <text class="legend" x="528" y="448" text-anchor="start">SyncE — frequency (optional)</text>
</svg>
